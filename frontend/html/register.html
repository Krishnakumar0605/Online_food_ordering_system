<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Food Ordering</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <h1 class="home">JK Food Center</h1>
      <nav>
        <a href="index.html"><h2>Home</h2></a>
        <a href="orders.html"><h2>Orders</h2></a>
      </nav>
    </header>
    <center><h1>Register</h1></center>
    <form action="">
      <input type="text" placeholder="Name" class="name" required />
      <input type="email" placeholder="E-mail" class="email" required />
      <input type="tel" placeholder="Phone Number" class="phno" required />
      <input type="password" placeholder="Password" class="password" required />
      <div style="display: flex; gap: 40px;justify-content: center;align-items: center;">
        <a href="login.html" class="hov">Login</a>
        <button>Register</button>
      </div>
    </form>
    <div class="alerting"></div>
    <script src="../js/register.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
